apis:
  - aid: tiktok-shop:open-api
    name: TikTok Shop Open API
    description: >-
      RESTful Open API for managing TikTok Shop seller accounts, products,
      orders, fulfillment, returns and refunds, logistics, finance, and
      promotions. Authentication uses OAuth 2.0 with App ID and app secret
      issued through the TikTok Shop Partner Center.
    humanURL: https://partner.tiktokshop.com/docv2/page/main
    baseURL: https://open-api.tiktokglobalshop.com
