aid: tiktok-shop
name: TikTok Shop API
description: >-
  TikTok Shop is TikTok's integrated e-commerce platform that lets sellers,
  creators, and partners list products, manage inventory and fulfillment, and
  sell directly within TikTok's live streams, short videos, and shop tabs.
  The TikTok Shop Open API (open-api.tiktokglobalshop.com) is a RESTful API
  that uses OAuth 2.0 authentication and enables developers to programmatically
  manage products, orders, fulfillment, returns, finance, promotions, and
  seller authorization across TikTok Shop's global marketplaces.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
